# Render Blueprint — backend API only.
#
# The admin portal (admin/) deploys separately on Vercel, and the mobile app
# ships through EAS, so neither belongs here.
#
# Region is pinned to Singapore because the Supabase pooler lives in
# aws-1-ap-southeast-1 — anywhere else adds a cross-region hop to every query.
#
# Every secret is `sync: false`, meaning Render will NOT read it from this file.
# Set the values once in the dashboard (or `render env set`); they are never
# committed. Copy them from server/.env.
services:
  - type: web
    name: ailernova-api
    runtime: node
    # `free` so this deploys without a paid workspace. The tradeoff is real:
    # free instances sleep after ~15min idle and cold-start in ~50s, which
    # breaks the AI SSE streams — switch to `starter` ($7/mo) before real users.
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm ci && npx prisma generate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # PORT is deliberately not set — Render injects it, and config/env.js reads
      # process.env.PORT with a 5000 fallback for local runs. Pinning it here
      # would fight whatever Render assigns.

      # ── Required: the server refuses to boot without these ────────────────
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false

      # ── Google sign-in (server verifies Google ID tokens against this) ────
      # Not a secret — an OAuth *client id* is a public identifier and already ships
      # inside the app bundle (app.json → expo.extra.google.webClientId). It is
      # inlined here rather than sync:false because it is not in server/.env, so
      # there is nothing to copy from and a dashboard prompt would just be guessed
      # wrong. It MUST stay identical to the app's value or Google ID-token
      # verification fails on audience mismatch.
      - key: GOOGLE_WEB_CLIENT_ID
        value: 87773466841-e4mu2gmd5evup3gg6vf58hqs0ogumvas.apps.googleusercontent.com

      # ── Supabase (storage for uploaded content images) ────────────────────
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false

      # ── AI: lessons, doubts, knowledge ────────────────────────────────────
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: anthropic
      - key: AI_LESSON_MODEL
        sync: false
      - key: AI_DOUBT_MODEL
        sync: false
      - key: AI_KNOWLEDGE_MODEL
        sync: false
      - key: MOCK_AI
        value: "false"

      # ── Teacher voice ─────────────────────────────────────────────────────
      # PRIMARY is ElevenLabs (config/env.js defaults TTS_PROVIDER to elevenlabs)
      # and there is DELIBERATELY no fallback chain: without ELEVENLABS_API_KEY the
      # server reports TTS disabled and the app drops to on-device TTS, which sounds
      # like a different teacher. The key must belong to a PAYING ElevenLabs account
      # — free plans answer 402 on the TTS API. ELEVENLABS_VOICE_ID has a code
      # default, so it is only needed here to override it.
      - key: TTS_PROVIDER
        value: elevenlabs
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      # Only read when TTS_PROVIDER=openai. Left here so switching provider is a
      # one-value change in the dashboard rather than a redeploy of this file.
      - key: OPENAI_API_KEY
        sync: false

      # ── Embeddings / RAG ──────────────────────────────────────────────────
      - key: VOYAGE_API_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        value: voyage
      - key: EMBEDDING_MODEL
        sync: false
      - key: EMBEDDING_DIM
        sync: false
      - key: RAG_TOP_K
        sync: false
      - key: RAG_MIN_SIMILARITY
        sync: false

      # ── Phone OTP login (MSG91) ───────────────────────────────────────────
      # Deliberately omitted: nothing in server/src reads config.sms yet — there
      # is no OTP route. Add these keys when phone login is actually built.

      # ── Transactional mail ────────────────────────────────────────────────
      # Password reset is the only mail the app sends, and SMTP is the only
      # transport (a Resend-over-HTTP path was removed — it could not deliver to
      # anyone but the account owner until a sending domain was verified).
      #
      # Without SMTP_HOST nothing is sent, and NOTHING SAYS SO: /forgot-password
      # answers "a reset link is on its way" either way, deliberately, so it cannot
      # be used to discover which addresses are registered. That safety property is
      # also what makes a missing value here invisible. `node scripts/check-mail.js`
      # is the only thing that will tell you.
      #
      # ailernova.in receives on mx1/mx2.hostinger.com, so smtp.hostinger.com is the
      # sending host and 465 is its implicit-TLS port. Sending as an address on a
      # domain we already receive on means SPF and DKIM are in place already.
      - key: SMTP_HOST
        value: smtp.hostinger.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        value: Ailernova <support@ailernova.in>
      # The reset link is built from this. Unset, the emailed link points at
      # localhost and every reset dead-ends.
      - key: APP_PUBLIC_URL
        value: https://ailernova-api.onrender.com

      # ── Misc ──────────────────────────────────────────────────────────────
      - key: JWT_EXPIRES_IN
        sync: false
      # Comma-separated origin allowlist. Cannot be "*" — the API sends
      # credentials: true, and browsers reject a wildcard on credentialed
      # requests. Unset in production ⇒ cross-origin browser calls are denied;
      # the native app and the admin portal's server-side rewrite send no
      # Origin header, so neither is affected.
      - key: ALLOWED_ORIGINS
        sync: false

      # Empty on purpose. A non-empty allowlist lets those accounts pick any
      # class via a client-supplied ?class= — the one spot where client input
      # overrides server-side scope. Set it in the dashboard only if you mean to.
      - key: TESTER_EMAILS
        value: ""
